<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_activity-hackathon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow_activity-hackathon" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_activity-hackathon" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="440" height="260" rx="16" fill="url(#bg_activity-hackathon)"/>
  <rect width="440" height="260" rx="16" fill="url(#glow_activity-hackathon)"/>
  <rect width="440" height="260" rx="16" fill="url(#grid_activity-hackathon)"/>
  
  <!-- Decorative floating circles -->
  <circle cx="390" cy="50" r="80" fill="#A5B4FC" fill-opacity="0.12" filter="blur(20px)"/>
  <circle cx="60" cy="220" r="70" fill="#4F46E5" fill-opacity="0.25" filter="blur(20px)"/>

  <!-- Tag Pill -->
  <g transform="translate(24, 24)">
    <rect width="188" height="26" rx="13" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#A5B4FC"/>
    <text x="22" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.3">Beni-Suef University</text>
  </g>

  <!-- Big Icon Badge -->
  <g transform="translate(356, 24)">
    <rect width="60" height="60" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <g transform="translate(18, 18)">
      <circle cx="12" cy="8" r="6" stroke="#fff" stroke-width="2"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Title & Description text -->
  <text x="26" y="170" fill="#ffffff" font-family="'Plus Jakarta Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">University Hackathon</text>
  <text x="26" y="198" fill="rgba(255,255,255,0.85)" font-family="'Plus Jakarta Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif" font-size="13" font-weight="500">Best Technical Architecture Award</text>

  <!-- Bottom Accent bar -->
  <rect x="26" y="222" width="48" height="4" rx="2" fill="#A5B4FC"/>
  <text x="84" y="227" fill="rgba(255,255,255,0.6)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">Verified Activity · Mohammed Siddiq</text>
</svg>