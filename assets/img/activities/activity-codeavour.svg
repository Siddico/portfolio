      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#1F1147"/>
    </linearGradient>
    <radialGradient id="glow_activity-codeavour" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF0080" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_activity-codeavour" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="440" height="260" rx="16" fill="url(#bg_activity-codeavour)"/>
  <rect width="440" height="260" rx="16" fill="url(#glow_activity-codeavour)"/>
