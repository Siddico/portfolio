  <circle cx="60" cy="220" r="70" fill="#7928CA" fill-opacity="0.25" filter="blur(20px)"/>

  <!-- Tag Pill -->
  <g transform="translate(24, 24)">
    <rect width="188" height="26" rx="13" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#FF0080"/>
    <text x="22" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.3">Organizing Committee</text>
