  <text x="26" y="198" fill="rgba(255,255,255,0.85)" font-family="'Plus Jakarta Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif" font-size="13" font-weight="500">AI & Robotics Global Competition 2026</text>

