    <circle cx="80" cy="34" r="22" fill="#3B82F6" fill-opacity="0.2"/>
    <circle cx="80" cy="34" r="8" fill="#3B82F6"/>
    <circle cx="180" cy="34" r="8" fill="#6B7280"/>
    <circle cx="280" cy="34" r="8" fill="#6B7280"/>
    <circle cx="380" cy="34" r="8" fill="#6B7280"/>
